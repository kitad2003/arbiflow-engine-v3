name: V42 Research Readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check balancer-research-v1/deployment-plan-v42.js
      - run: node balancer-research-v1/deployment-plan-v42-test.js
      - run: node balancer-research-v1/deployment-plan-v42.js
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          V42_OPERATOR_ADDRESS: ${{ vars.V42_OPERATOR_ADDRESS }}
