name: ArbiFlow 12.9.79 GHO Atomic Fork
on:
  workflow_dispatch:
  push:
    paths:
      - 'GhoAtomicFork12979.js'
      - 'atomic-mock-contracts/GhoAtomicExecutor12979.sol'
      - '.github/workflows/gho-atomic-fork-12979.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: node --check GhoAtomicFork12979.js
      - name: Require Ethereum RPC
        run: |
          if [ -z "$ETHEREUM_RPC_URL" ]; then
            echo "ETHEREUM_RPC_URL missing, fork test not started"
            exit 1
          fi
      - run: npm run test:gho-atomic-fork
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gho-atomic-fork-12979
          path: arbiflow-atomic-gho-12979.json
          if-no-files-found: warn
