name: ArbiFlow 12.9.29 Execution Readiness
on:
  workflow_dispatch:
  push:
    paths:
      - 'ExecutionReadiness12929.js'
      - '.github/workflows/execution-readiness-12929.yml'
jobs:
  fork-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      READINESS_LOAN_SIZES_USDC: '10000,25000,50000,100000,250000,500000,1000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test ranked flash-loan routes in disposable Base fork
        run: npm run test:execution-readiness
