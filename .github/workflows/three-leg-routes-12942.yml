name: ArbiFlow 12.9.42 Three Leg Routes
on:
  workflow_dispatch:
  push:
    paths:
      - 'ThreeLegRoutes12942.js'
      - '.github/workflows/three-leg-routes-12942.yml'
jobs:
  verify-three-leg:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify three-leg Base routes read-only
        run: npm run test:three-leg-routes
