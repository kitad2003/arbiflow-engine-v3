name: ArbiFlow 12.9.19 Read Only Evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'OnChainEvidence12919.js'
      - '.github/workflows/onchain-evidence-12919.yml'
jobs:
  evidence-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test read-only chain evidence collector
        run: npm run test:onchain-evidence
