name: ArbiFlow Router Decoding V4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  router-decoding:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check pending-research/swap-decoder-v4.js
      - run: node pending-research/swap-decoder-v4-test.js
      - run: node pending-research/router-decoding-v4.js
