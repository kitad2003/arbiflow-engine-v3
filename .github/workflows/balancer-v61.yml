name: Balancer V61 Read Only Economic Screening
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax verification
        run: node --check balancer-research-v1/economic-screen-v61.js
      - name: Unit tests
        run: node balancer-research-v1/economic-screen-v61-test.js
      - name: Current block read only screening
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
        run: node balancer-research-v1/economic-screen-v61.js
