name: ArbiFlow 12.9.43 Dynamic Routes
on:
  workflow_dispatch:
  push:
    paths:
      - 'DynamicRoutes12943.js'
      - '.github/workflows/dynamic-routes-12943.yml'
jobs:
  route-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dynamic two and three leg read-only scan
        run: npm run test:dynamic-routes
