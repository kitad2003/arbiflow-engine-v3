name: Clean Balancer V14 MEV-Share Hint Visibility Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-hints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit module syntax and tests
        run: |
          node --check balancer-research-v1/hint-audit-v14.js
          node balancer-research-v1/hint-audit-v14-test.js
      - name: Read-only live Ethereum MEV-Share hint audit
        run: node balancer-research-v1/hint-audit-v14.js
