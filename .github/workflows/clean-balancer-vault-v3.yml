name: Clean Balancer V3 Read-Only Vault Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and fail-closed research tests
        run: |
          node --check balancer-research-v1/verify-vault.js
          node balancer-research-v1/verify-vault-test.js
      - name: Verify documented Base Balancer V2 Vault and Base USDC (read-only)
        env:
          BALANCER_RESEARCH_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BALANCER_RESEARCH_VAULT_ADDRESS: '0xBA12222222228d8Ba445958a75a0704d566BF2C8'
          BALANCER_RESEARCH_TOKEN_ADDRESS: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          BALANCER_RESEARCH_CHAIN_ID: '8453'
        run: |
          if [ -z "$BALANCER_RESEARCH_RPC_URL" ]; then
            echo "BASE_RPC_URL_SECRET_MISSING: Add an HTTPS Base RPC URL in Actions repository secrets"
            exit 1
          fi
          node balancer-research-v1/verify-vault.js
