name: ArbiFlow 12.9.13 Atomic Aave DEX Fork
on:
  workflow_dispatch:
  push:
    paths:
      - 'atomic-mock-contracts/AaveDexAtomicFork12913.sol'
      - 'AaveDexAtomicForkTest12913.js'
      - '.github/workflows/aave-dex-atomic-12913.yml'
jobs:
  fork-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require private RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Run atomic fail-closed Base fork test
        run: npm run test:aave-dex-atomic-fork
