name: ArbiFlow 12.9.78 GHO Cross Venue
on:
  workflow_dispatch:
  push:
    paths:
      - 'GhoCrossVenue12978.js'
      - '.github/workflows/gho-cross-venue-12978.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: node --check GhoCrossVenue12978.js
      - name: Require Ethereum RPC
        run: |
          if [ -z "$ETHEREUM_RPC_URL" ]; then
            echo "ETHEREUM_RPC_URL missing; cross venue scan NOT TESTED"
            exit 1
          fi
      - run: npm run test:gho-cross-venue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gho-cross-venue-12978
          path: arbiflow-gho-cross-venue-12978.json
          if-no-files-found: warn
