name: ArbiFlow 12.9.69 LST Research
on:
  workflow_dispatch:
  push:
    paths:
      - 'LSTResearch12969.js'
      - '.github/workflows/lst-research-12969.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify source syntax
        run: node --check LSTResearch12969.js
      - name: Run LST versus blue-chip research
        run: npm run test:lst-research
      - name: Upload complete diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lst-research-12969
          path: arbiflow-lst-research-12969.json
          if-no-files-found: warn
