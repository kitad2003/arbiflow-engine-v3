name: ArbiFlow Flashblocks Capability Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flashblocks-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate pendingLogs probe syntax
        run: |
          node --check ResearchFlashblocksProbe.js
          node --check ResearchSwapDecoder.js
          node ResearchSwapDecoder.js
          node --check ResearchPoolIdentity.js
          node ResearchPoolIdentity.js
          node --check ResearchV3Spot.js
          node ResearchV3Spot.js
          node --check ResearchSpotComparison.js
          node ResearchSpotComparison.js
          node --check ResearchOrderingEvidence.js
          node ResearchOrderingEvidence.js
          node --check ResearchReceiptCorroboration.js
          node ResearchReceiptCorroboration.js
          node --check ResearchTransactionSequence.js
          node ResearchTransactionSequence.js
          node --check ResearchOrderedPoolSnapshots.js
          node ResearchOrderedPoolSnapshots.js
          node --check ResearchEventSignatureCensus.js
          node ResearchEventSignatureCensus.js
          node --check ResearchEventLiquidityGraph.js
          node ResearchEventLiquidityGraph.js
          node --check ResearchAaveBaseFlashLoan.js
          node ResearchAaveBaseFlashLoan.js
      - name: Probe preconfirmed pendingLogs support
        env:
          BASE_RESEARCH_WSS_URL: ${{ secrets.BASE_RESEARCH_WSS_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RESEARCH_POOL_ADDRESSES: ${{ vars.BASE_RESEARCH_POOL_ADDRESSES }}
          RESEARCH_WATCH_SECONDS: '25'
        run: |
          if [ -z "$BASE_RESEARCH_WSS_URL" ] || [ -z "$BASE_RESEARCH_POOL_ADDRESSES" ]; then
            echo "LIVE_FEED_SETTINGS_MISSING"
            exit 1
          fi
          node ResearchFlashblocksProbe.js
      - name: Verify Aave V3 Base flash-loan prerequisites (read-only)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          AAVE_RESEARCH_LIVE: '1'
        run: |
          if [ -z "$BASE_RPC_URL" ]; then
            echo "AAVE_RESEARCH_RPC_MISSING"
            exit 1
          fi
          node ResearchAaveBaseFlashLoan.js
      - name: Archive capability result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashblocks-capability
          path: |
            arbiflow-flashblocks-capability.json
            arbiflow-aave-read-only.json
          if-no-files-found: warn
