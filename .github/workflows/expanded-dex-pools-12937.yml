name: ArbiFlow 12.9.37 Expanded DEX Pools
on:
  workflow_dispatch:
  push:
    paths:
      - 'ExpandedDexPools12937.js'
      - '.github/workflows/expanded-dex-pools-12937.yml'
jobs:
  verify-pools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify Aerodrome V1 and PancakeSwap V3 pools
        run: npm run test:expanded-dex-pools
