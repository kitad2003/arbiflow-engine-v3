name: Balancer V55 Liquidity Quote Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: V55 math unit tests
        run: node balancer-research-v1/liquidity-quotes-v55-test.js
      - name: Confirmed-block read-only reserve and gross quote evaluation
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
        run: node balancer-research-v1/liquidity-quotes-v55.js
