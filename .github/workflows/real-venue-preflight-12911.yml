name: ArbiFlow 12.9.11 Real Venue Preflight
on:
  workflow_dispatch:
  push:
    paths:
      - 'RealVenuePreflight12911.js'
      - '.github/workflows/real-venue-preflight-12911.yml'
jobs:
  read-only-venue-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify RPC secret configured
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify actual Base exchange pools
        run: npm run test:real-venue-preflight
