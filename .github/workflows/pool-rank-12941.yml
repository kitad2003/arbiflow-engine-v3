name: ArbiFlow 12.9.41 Pool Ranking
on:
  workflow_dispatch:
  push:
    paths:
      - 'PoolRank12941.js'
      - 'PoolUniverse12939.js'
      - '.github/workflows/pool-rank-12941.yml'
jobs:
  verify-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Discover expanded token universe and rank depth-gated cross-DEX round trips
        run: npm run test:pool-rank
