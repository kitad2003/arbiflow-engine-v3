name: ArbiFlow 12.9.72 Alternative Strategy Evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'AlternativeEvidence12972.js'
      - '.github/workflows/alternative-evidence-12972.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      LIQUIDATION_LOG_BLOCKS: 2000
      LIQUIDATION_USER_LIMIT: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: node --check AlternativeEvidence12972.js
      - run: npm run test:alternative-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alternative-evidence-12972
          path: arbiflow-alternative-evidence-12972.json
          if-no-files-found: warn
