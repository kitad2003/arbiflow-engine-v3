name: ArbiFlow 12.9.14 Both Swap Legs Fork Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'atomic-mock-contracts/AaveDexAtomicFork12913.sol'
      - 'AaveDexProbe12914.js'
      - '.github/workflows/atomic-probe-12914.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check RPC secret
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Probe both actual swap legs inside Aave callback
        run: npm run test:atomic-two-swaps-probe
