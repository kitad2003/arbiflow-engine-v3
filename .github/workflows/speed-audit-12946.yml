name: ArbiFlow 12.9.46 Speed Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'SpeedAudit12946.js'
      - '.github/workflows/speed-audit-12946.yml'
jobs:
  speed-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Inspect confirmed and pending Base state latency
        run: npm run test:speed-audit
