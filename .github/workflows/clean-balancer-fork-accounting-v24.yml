name: Clean Balancer V24 Exact Reverts and Accounting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: V24 Ethereum fork guardrails and failure accounting
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
        run: |
          node --check balancer-research-v1/ethereum-fork-v24.js
          npx hardhat run --config balancer-research-v1/ethereum-fork-v17.config.js balancer-research-v1/ethereum-fork-v24.js
