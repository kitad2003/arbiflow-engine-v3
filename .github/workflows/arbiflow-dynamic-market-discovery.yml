name: ArbiFlow dynamic market discovery
on:
  workflow_dispatch:
    inputs:
      from_block:
        description: 'Optional historical start block (blank resumes saved inventory)'
        required: false
        default: ''
      to_block:
        description: 'Optional ending block (blank uses chain head)'
        required: false
        default: ''
      chunk_size:
        description: 'RPC event-log block range per request (1-2000)'
        required: false
        default: '8'
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    concurrency:
      group: arbiflow-base-inventory
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore prior market inventory
        uses: actions/cache/restore@v4
        with:
          path: arbiflow-market-inventory-12967.json
          key: arbiflow-base-market-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arbiflow-base-market-
      - name: Restore inventory from most recent workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=arbiflow-dynamic-market-discovery&per_page=100" --jq '.artifacts[] | select(.expired == false) | .id' | head -n 1 || true)"
          if [[ -n "$id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > /tmp/arbiflow-prior.zip
            unzip -p /tmp/arbiflow-prior.zip arbiflow-market-inventory-12967.json > /tmp/arbiflow-prior-inventory.json || true
            if [[ -s /tmp/arbiflow-prior-inventory.json ]]; then
              node -e 'const fs=require("fs");const p="/tmp/arbiflow-prior-inventory.json";const d=JSON.parse(fs.readFileSync(p));if(d.chainId!==8453||!Array.isArray(d.pools)||!Number.isSafeInteger(d.lastCompleteBlock))process.exit(1);const local="arbiflow-market-inventory-12967.json";let prev=null;try{prev=JSON.parse(fs.readFileSync(local))}catch{};if(!prev||!Number.isSafeInteger(prev.lastCompleteBlock)||d.lastCompleteBlock>prev.lastCompleteBlock){fs.copyFileSync(p,local)};const active=JSON.parse(fs.readFileSync(local));console.log(JSON.stringify({inventoryRestored:true,lastCompleteBlock:active.lastCompleteBlock,pools:active.pools.length}))'
            fi
          fi
          if [[ ! -f arbiflow-market-inventory-12967.json ]]; then
            echo "No prior inventory found: first-run bootstrap will scan latest 1000 blocks."
          fi
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check DynamicMarketDiscovery12964.js
      - name: Discover factory-created pools
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          FROM_BLOCK: ${{ inputs.from_block }}
          TO_BLOCK: ${{ inputs.to_block }}
          CHUNK_SIZE: ${{ inputs.chunk_size }}
        run: node DynamicMarketDiscovery12964.js
      - name: Save updated market inventory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: arbiflow-market-inventory-12967.json
          key: arbiflow-base-market-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build address-native route graph
        if: success()
        run: node DynamicAddressRoutes12968.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbiflow-dynamic-market-discovery
          path: |
            arbiflow-dynamic-discovery-12964.json
            arbiflow-market-inventory-12967.json
            arbiflow-address-route-graph-12968.json
          if-no-files-found: warn
