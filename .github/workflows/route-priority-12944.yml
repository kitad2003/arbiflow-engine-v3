name: ArbiFlow 12.9.44 Route Priority
on:
  workflow_dispatch:
  push:
    paths:
      - 'RoutePriority12944.js'
      - '.github/workflows/route-priority-12944.yml'
jobs:
  rank-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test route priority diagnostic
        run: npm run test:route-priority
