name: ArbiFlow 12.9.67 All-Pool Discrepancy
on:
  workflow_dispatch:
  push:
    paths:
      - 'MarketDiscrepancy12967.js'
      - '.github/workflows/market-discrepancy-12967.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      HUNTER_ROUTE_LIMIT: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax verification
        run: node --check MarketDiscrepancy12967.js
      - name: Run confirmed-block read-only pool and route audit
        run: npm run test:market-discrepancy
      - name: Preserve full route diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-discrepancy-12967
          path: arbiflow-discrepancy-12967.json
          if-no-files-found: warn
