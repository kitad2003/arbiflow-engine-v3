name: ArbiFlow 12.9.35 Multi-Pool Discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'MultiPoolDiscovery12935.js'
      - '.github/workflows/multi-pool-discovery-12935.yml'
jobs:
  inspect-v3-pools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Inspect Uniswap V3 fee tier pools on Base
        run: npm run test:multi-pool-discovery
