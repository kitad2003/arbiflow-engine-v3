name: ArbiFlow 12.9.58 Event Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'EventValidation12958.js'
      - '.github/workflows/event-validation-12958.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      BASE_FLASHBLOCKS_WSS_URL: ${{ secrets.BASE_FLASHBLOCKS_WSS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Event-driven read-only validation
        run: npm run test:event-validation
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-validation-12958
          path: arbiflow-event-validation-12958.json
          if-no-files-found: warn
