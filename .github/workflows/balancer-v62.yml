name: Balancer V62 Expanded Pair Discovery
on:
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check syntax and unit tests
        run: |
          node --check balancer-research-v1/expanded-discovery-v62.js
          node balancer-research-v1/expanded-discovery-v62-test.js
      - name: Live read-only Ethereum research
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
        run: node balancer-research-v1/expanded-discovery-v62.js
