name: Clean Balancer V18 Flashbots Backrun Target Evidence Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate target transaction evidence handling
        run: |
          node --check balancer-research-v1/backrun-evidence-v18.js
          node balancer-research-v1/backrun-evidence-v18-test.js
      - name: Report readiness without pretending to simulate pending trades
        run: node balancer-research-v1/backrun-evidence-v18.js
