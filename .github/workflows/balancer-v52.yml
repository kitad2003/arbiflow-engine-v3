name: Balancer V52 Live Discovery Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify V51 tests
        run: |
          node balancer-research-v1/dynamic-pair-cache-v51-test.js
          node balancer-research-v1/pending-integrated-v51-test.js
      - name: Observe MEV-Share pending hints for 60 seconds
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          V51_DURATION_MS: '60000'
        run: |
          if [ -z "$ETHEREUM_RPC_URL" ]; then
            echo 'ETHEREUM_RPC_URL secret missing; no live observation performed'
            exit 1
          fi
          node balancer-research-v1/pending-integrated-v51.js
