name: ArbiFlow Dynamic DEX Registry V1
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Registry syntax and offline tests
        run: |
          node --check dex-registry/dynamic-dex-registry-v1.js
          node dex-registry/dynamic-dex-registry-v1-test.js
