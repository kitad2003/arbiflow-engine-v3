name: ArbiFlow Manual Base Trace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  base-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: build-12.9.90-base-trace-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Offline tests
        run: npm run test:base-validation
      - name: Verify RPC secret exists
        env:
          BASE_TRACE_RPC_URL: ${{ secrets.BASE_TRACE_RPC_URL }}
        run: |
          if [ -z "$BASE_TRACE_RPC_URL" ]; then
            echo '::error::Missing BASE_TRACE_RPC_URL GitHub Actions secret'
            exit 1
          fi
      - name: Probe RPC capabilities
        id: capabilities
        continue-on-error: true
        env:
          BASE_TRACE_RPC_URL: ${{ secrets.BASE_TRACE_RPC_URL }}
        run: npm run test:base-rpc-capabilities
      - name: Historical trace
        if: steps.capabilities.outcome == 'success'
        env:
          BASE_TRACE_RPC_URL: ${{ secrets.BASE_TRACE_RPC_URL }}
          ARBIFLOW_ENABLE_TRACE_PROBE: '1'
          ARBIFLOW_REQUIRE_HISTORICAL_TRACE: '1'
        run: npm run test:base-trace
      - name: Install Foundry for isolated transaction fork
        if: steps.capabilities.outcome == 'success'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Transaction-position fork startup probe
        if: steps.capabilities.outcome == 'success'
        env:
          BASE_TRACE_RPC_URL: ${{ secrets.BASE_TRACE_RPC_URL }}
        run: npm run test:base-tx-fork
      - name: Explain diagnostic result
        if: always()
        run: |
          if [ -f arbiflow-base-trace-12990.json ]; then
            node -e 'const r=require("./arbiflow-base-trace-12990.json");for(const [k,v] of Object.entries({status:r.status,reason:r.reason,traceSupported:r.rpcTraceSupported,traceProbed:r.traceProbed,traceComplete:r.historicalTraceEvidenceComplete,reconstruction:r.reconstructionReadiness?.code,executionEligible:r.executionEligible}))console.log(k+": "+v)'
          else
            echo 'No trace report was written. Check install, configuration, and test steps.'
          fi
      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-trace-evidence
          path: |
            arbiflow-base-trace-12990.json
            arbiflow-base-tx-fork-129113.json
          if-no-files-found: warn
      - name: Fail if RPC capability probe failed
        if: steps.capabilities.outcome == 'failure'
        run: |
          echo '::error::RPC tracing capability probe failed. Review its output before retrying historical replay.'
          exit 1
