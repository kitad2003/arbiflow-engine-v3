name: ArbiFlow Multichain Transaction Intelligence V3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check pending-research/multichain-transaction-intelligence-v3.js
      - run: node pending-research/multichain-transaction-intelligence-v3-test.js
      - name: Classify Ethereum and Base observed transactions
        env:
          ETHEREUM_WSS_URL: ${{ secrets.ETHEREUM_WSS_URL }}
          BASE_FLASHBLOCKS_WSS_URL: ${{ secrets.BASE_FLASHBLOCKS_WSS_URL }}
          INTELLIGENCE_DURATION_MS: '30000'
        run: node pending-research/multichain-transaction-intelligence-v3.js
