name: ArbiFlow 12.9.28 Loan Size Optimization
on:
  workflow_dispatch:
  push:
    paths:
      - 'LoanOptimizer12928.js'
      - '.github/workflows/loan-optimizer-12928.yml'
jobs:
  loan-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Rank real read-only flash loan quotes
        run: npm run test:loan-optimizer
