name: ArbiFlow 12.9.61 Dynamic Sizing
on:
  workflow_dispatch:
  push:
    paths:
      - 'DynamicSizing12961.js'
      - '.github/workflows/dynamic-sizing-12961.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      SIZE_OPT_ROUTE_LIMIT: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Run read-only sizing audit
        run: npm run test:dynamic-sizing
      - name: Preserve diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-sizing-12961
          path: arbiflow-sizing-12961.json
          if-no-files-found: warn
