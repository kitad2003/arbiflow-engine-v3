name: Clean Balancer Research V1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check standalone research bot syntax
        run: node --check balancer-research-v1/bot.js
      - name: Run standalone event and venue screening tests
        run: node balancer-research-v1/test.js
