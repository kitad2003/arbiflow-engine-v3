name: ArbiFlow 12.9.60 Direction Intelligence
on:
  workflow_dispatch:
  push:
    paths:
      - 'DirectionIntelligence12960.js'
      - '.github/workflows/direction-intelligence-12960.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      BASE_FLASHBLOCKS_WSS_URL: ${{ secrets.BASE_FLASHBLOCKS_WSS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Direction-aware read-only audit
        run: npm run test:direction-intelligence
      - name: Preserve diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direction-intelligence-12960
          path: arbiflow-direction-12960.json
          if-no-files-found: warn
