name: Balancer V66 Chainstack Economic Triage
on:
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and unit tests
        run: |
          node --check balancer-research-v1/chainstack-triage-v66.js
          node balancer-research-v1/chainstack-triage-v66-test.js
          node balancer-research-v1/expanded-discovery-v62-test.js
          node balancer-research-v1/economic-triage-v64-test.js
      - name: Chainstack read-only V62 plus V64 economic triage
        env:
          ETHEREUM_RPC_URL: ${{ secrets.CHAINSTACK_RPC_URL }}
        run: |
          if [ -z "$ETHEREUM_RPC_URL" ]; then echo "::error::CHAINSTACK_RPC_URL missing"; exit 1; fi
          node balancer-research-v1/chainstack-triage-v66.js
