name: ArbiFlow 12.9.30 Atomic Settlement Gas
on:
  workflow_dispatch:
  push:
    paths:
      - 'AtomicSettlementGas12930.js'
      - '.github/workflows/atomic-settlement-gas-12930.yml'
jobs:
  fork-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Base RPC
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL missing"; exit 1; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify fork atomic settlement and gas diagnostics
        run: npm run test:atomic-settlement-gas
