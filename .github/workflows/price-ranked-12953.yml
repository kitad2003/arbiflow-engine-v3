name: ArbiFlow 12.9.53 Price Ranked Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'OpportunityAudit12953.js'
      - '.github/workflows/price-ranked-12953.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: arbiflow-12953
      cancel-in-progress: false
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      AUDIT_ROUTE_LIMIT: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Run price-ranked quote audit
        run: npm run test:price-ranked-audit
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-ranked-audit-12953
          path: arbiflow-audit-12953.json
          if-no-files-found: warn
